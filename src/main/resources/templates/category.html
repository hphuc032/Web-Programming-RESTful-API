<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý Category</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" href="/">LTWeb Project 1</a><div class="navbar-nav ms-auto"><a class="nav-link active" href="/categories">Danh mục</a><a class="nav-link" href="/products">Sản phẩm</a><a class="nav-link" href="/swagger-ui/index.html">Swagger</a></div></div></nav>
<main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-1">Category Management</h1><p class="text-secondary mb-0">Dữ liệu được tải và cập nhật hoàn toàn bằng jQuery AJAX.</p></div><button id="addCategory" class="btn btn-primary">+ Thêm danh mục</button></div><div id="alertBox"></div>
<div class="card shadow-sm border-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Icon</th><th>Category Name</th><th class="text-end">Actions</th></tr></thead><tbody id="categoryRows"><tr><td colspan="4" class="text-center py-4">Đang tải...</td></tr></tbody></table></div></div></main>
<div class="modal fade" id="categoryModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="categoryForm" enctype="multipart/form-data"><div class="modal-header"><h2 class="modal-title fs-5" id="categoryModalTitle">Thêm danh mục</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="categoryId"><div class="mb-3"><label class="form-label" for="categoryName">Category Name</label><input class="form-control" id="categoryName" name="categoryName" maxlength="200" required></div><div><label class="form-label" for="icon">Icon</label><input class="form-control" type="file" id="icon" name="icon" accept="image/png,image/jpeg,image/gif,image/webp"><div class="form-text">Để trống khi sửa để giữ icon hiện tại.</div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" id="saveCategory" type="submit">Lưu</button></div></form></div></div>
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/category.js"></script></body></html>
