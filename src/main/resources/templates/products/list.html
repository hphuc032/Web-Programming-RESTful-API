<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách sản phẩm</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Danh sách sản phẩm</h1>
        <a class="btn btn-primary" th:href="@{/products/create}">+ Thêm sản phẩm</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form class="card card-body mb-3" method="get" th:action="@{/products}">
        <div class="row g-2 align-items-end">
            <div class="col-md-7">
                <label for="keyword" class="form-label">Tìm theo tên sản phẩm</label>
                <input id="keyword" type="text" class="form-control" name="keyword"
                       th:value="${keyword}" placeholder="Nhập tên sản phẩm...">
            </div>
            <div class="col-md-2">
                <label for="size" class="form-label">Số dòng</label>
                <select id="size" class="form-select" name="size">
                    <option value="5" th:selected="${size == 5}">5</option>
                    <option value="10" th:selected="${size == 10}">10</option>
                    <option value="20" th:selected="${size == 20}">20</option>
                </select>
            </div>
            <div class="col-md-3 d-grid">
                <button class="btn btn-success" type="submit">Tìm kiếm</button>
            </div>
        </div>
    </form>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Hình ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Mô tả</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products.content}">
                <td th:text="${product.id}"></td>
                <td class="text-center">
                    <img th:if="${product.images != null and !#strings.isEmpty(product.images)}"
                         th:src="@{'/uploads/products/' + ${product.images}}"
                         th:alt="${product.name}"
                         style="width:80px;height:80px;object-fit:cover;border-radius:8px;">
                    <span class="text-secondary"
                          th:if="${product.images == null or #strings.isEmpty(product.images)}">
                        Chưa có ảnh
                    </span>
                </td>
                <td class="fw-semibold" th:text="${product.name}"></td>
                <td class="text-nowrap">
                    <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}"></span>
                </td>
                <td th:text="${product.quantity}"></td>
                <td style="min-width:220px" th:text="${product.description}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-warning btn-sm"
                       th:href="@{/products/edit/{id}(id=${product.id})}">Sửa</a>
                    <a class="btn btn-danger btn-sm"
                       th:href="@{/products/delete/{id}(id=${product.id})}"
                       onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="alert alert-warning mt-3" th:if="${products.totalElements == 0}">
        Không tìm thấy sản phẩm.
    </div>

    <nav class="mt-3" aria-label="Phân trang" th:if="${products.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${products.first} ? '#' : @{/products(page=${products.number - 1},size=${size},keyword=${keyword})}">
                    Previous
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/products(page=${i},size=${size},keyword=${keyword})}"></a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${products.last} ? '#' : @{/products(page=${products.number + 1},size=${size},keyword=${keyword})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
