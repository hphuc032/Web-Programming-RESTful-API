<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý Product</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" href="/">LTWeb Project 1</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/categories">Danh mục</a><a class="nav-link active" href="/products">Sản phẩm</a><a class="nav-link" href="/swagger-ui/index.html">Swagger</a></div></div></nav>
<main class="container-fluid px-lg-5 py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-1">Product Management</h1><p class="text-secondary mb-0">Category dropdown được tải trực tiếp từ API.</p></div><button id="addProduct" class="btn btn-primary">+ Thêm sản phẩm</button></div><div id="alertBox"></div>
<div class="card shadow-sm border-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Image</th><th>Product Name</th><th>Quantity</th><th>Unit Price</th><th>Discount</th><th>Category</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody id="productRows"><tr><td colspan="9" class="text-center py-4">Đang tải...</td></tr></tbody></table></div></div></main>
<div class="modal fade" id="productModal" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content" id="productForm" enctype="multipart/form-data"><div class="modal-header"><h2 class="modal-title fs-5" id="productModalTitle">Thêm sản phẩm</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="productId"><div class="row g-3"><div class="col-md-8"><label class="form-label" for="productName">Product Name</label><input class="form-control" id="productName" name="productName" maxlength="200" required></div><div class="col-md-4"><label class="form-label" for="categoryId">Category</label><select class="form-select" id="categoryId" name="categoryId" required><option value="">Chọn danh mục</option></select></div><div class="col-md-4"><label class="form-label" for="quantity">Quantity</label><input class="form-control" type="number" min="0" id="quantity" name="quantity" required></div><div class="col-md-4"><label class="form-label" for="unitPrice">Unit Price</label><input class="form-control" type="number" min="0" step="1000" id="unitPrice" name="unitPrice" required></div><div class="col-md-4"><label class="form-label" for="discount">Discount (%)</label><input class="form-control" type="number" min="0" max="100" step="0.1" id="discount" name="discount" required></div><div class="col-md-4"><label class="form-label" for="status">Status</label><select class="form-select" id="status" name="status" required><option value="1">Đang bán</option><option value="0">Ngừng bán</option></select></div><div class="col-md-8"><label class="form-label" for="image">Image</label><input class="form-control" type="file" id="image" name="image" accept="image/png,image/jpeg,image/gif,image/webp"><div class="form-text">Để trống khi sửa để giữ ảnh hiện tại.</div></div><div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" maxlength="2000" rows="3"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" id="saveProduct" type="submit">Lưu</button></div></form></div></div>
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/product.js"></script></body></html>
